<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENGSE203 LAB 3</title>
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">ENGSE203 • LAB 3</p>
      <h1>Campus Service Request</h1>
      <p>Responsive Web UI, Event and Form</p>
    </div>
  </header><br>

  <div class="container">
    <div class="grid cols-3">
      <div class="card blue">
        <h3 id="total-count">67</h3>
        <p class="small">Total</p>
      </div>
      <div class="card yellow">
        <h3 id="pending-count">6</h3>
        <p class="small">Pending</p>
      </div>
      <div class="card green">
        <h3 id="approved-count">7</h3>
        <p class="small">Approved</p>
      </div>
    </div>
  </div>

  <main class="container page-grid">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Create Service Request</h2>
      <form id="request-form" novalidate>
        <div class="field">
          <label for="name">Name (Minimum 2 characters.)</label>
          <input id="name" name="name" type="text" placeholder="John Doe" required />
          <small class="error" id="name-error"></small>
        </div>
        <div class="field">
          <label for="category">Service Category</label>
          <select id="category" name="category" required>
            <option value="">-- Please select a category --</option>
            <option value="it">IT Support</option>
            <option value="facilities">Facility Maintenance</option>
            <option value="library">Library Services</option>
            <option value="admin">Administrative Support</option>
          </select>
          <small class="error" id="category-error"></small>
        </div>
        <div class="field">
          <label for="details">Request Details</label>
          <textarea id="details" name="details" rows="5" placeholder="Please describe your request in detail..."
            required minlength="10"></textarea>
          <div class="field-meta">
            <small id="details-hint" class="hint">Minimum 10 characters.</small>
            <small id="details-counter" class="counter" aria-live="polite">0 characters</small>
          </div>
          <small class="error" id="details-error"></small>
        </div>
        <button type="submit">Submit Request</button>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>

    <aside class="panel preview-panel" aria-labelledby="preview-title">
      <h1 id="preview-title">Live Preview</h1>
      <p id="form-status-preview" class="status" role="status">Form is empty</p>
      <dl id="preview" aria-live="polite">
        <div>
          <h3>Name</h3>
          <p id="preview-name">ยังไม่ระบุชื่อ</p>
        </div>
        <div>
          <h3>Type</h3>
          <p id="preview-type">ยังไม่เลือกประเภท</p>
        </div>
        <div>
          <h3>Details</h3>
          <p id="preview-details">ยังไม่มีรายละเอียด</p>
        </div>
      </dl>
      <h3>Submitted Requests</h3>
      <ul id="request-list" class="request-list"></ul>
    </aside>
  </main>
</body>

</html>
